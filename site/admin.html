<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ניהול · Noa Cosmetics</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ניהול נעה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf6f2">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f2;--card:#fffdfb;--ink:#3a302b;--muted:#7d6d65;--accent:#86695e;--on:#fff;--pink:#ecd5d3;--line:#e6d9d1;--ok:#4f7d5c;--okbg:#e7f0e9;--bad:#a34a3f;--badbg:#f6e3df;--off:#efe9e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1f1b1a;--card:#2d2826;--ink:#f3ebe6;--muted:#c0b0a8;--accent:#c9a79a;--on:#2a1f1b;--pink:#4a3b3a;--line:#443b38;--ok:#8fc29c;--okbg:#26332a;--bad:#e59a8f;--badbg:#3d2724;--off:#2a2523}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1f1b1a;--card:#2d2826;--ink:#f3ebe6;--muted:#c0b0a8;--accent:#c9a79a;--on:#2a1f1b;--pink:#4a3b3a;--line:#443b38;--ok:#8fc29c;--okbg:#26332a;--bad:#e59a8f;--badbg:#3d2724;--off:#2a2523}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-weight:400;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top[hidden]{display:none}
.top img{width:38px;height:38px}
.top .t{flex:1;font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.12em;direction:ltr;text-align:right;font-size:1.05rem}
.top .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:.9rem;letter-spacing:.06em}
.top .btn.sm{padding:6px 10px;min-height:36px}
.top .t small{display:block;font-family:Heebo;letter-spacing:0;font-size:.75rem;color:var(--muted);direction:rtl}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--on);font-weight:500;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:.9rem;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;background:var(--off);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:60px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;scroll-snap-align:start;position:relative}
.day small{display:block;font-size:.72rem;color:var(--muted)}
.day b{display:block;font-size:1.25rem;font-weight:600}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.day.on small{color:var(--on);opacity:.85}
.day.closed{background:var(--off);color:var(--muted)}
.day.closed.on{background:var(--muted);color:var(--on)}
.day .n{position:absolute;top:-6px;left:-4px;background:var(--ink);color:var(--bg);border-radius:10px;font-size:.7rem;min-width:20px;height:20px;line-height:20px;padding:0 5px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:1.15rem;font-weight:600}
.banner{border-radius:14px;padding:14px;margin-bottom:12px;background:var(--off);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner.vac{background:var(--badbg);color:var(--bad)}
.slot{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.slot .h{font-weight:600;font-size:1.05rem;width:52px;flex:0 0 auto;direction:ltr;text-align:center}
.slot .m{flex:1;min-width:0}
.slot .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .m small{color:var(--muted);font-size:.85rem}
.slot .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:20px;font-weight:500}
.tag.free{background:var(--okbg);color:var(--ok)}
.tag.blk{background:var(--off);color:var(--muted)}
.slot.booked{border-color:var(--accent);border-inline-start:4px solid var(--accent)}
.slot.blocked{background:var(--off)}
.slot.past{opacity:.5}
.list .date{font-weight:600;margin:16px 0 8px;color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.login{max-width:420px;margin:40px auto;text-align:center}
.login img{width:84px;margin-bottom:10px}
.login h1{font-size:1.3rem;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.field{display:block;margin-bottom:12px;text-align:right}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-height:46px}
.sheet{position:fixed;inset:0;background:rgba(30,20,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:1.1rem}
.sheet p{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;transition:transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.muted{color:var(--muted);font-size:.85rem}
.loading{opacity:.5;pointer-events:none}
@media (max-width:440px){.slot.booked{flex-wrap:wrap}.slot.booked .m b{white-space:normal}.slot.booked .a{flex-basis:100%;justify-content:flex-start;padding-inline-start:64px}}
@media (max-width:360px){.top .t{font-size:0;letter-spacing:0}.top .t small{font-size:.85rem}.slot .a .btn.sm{padding:6px 9px}}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:20px}}
</style>
</head>
<body>
<div class="top" id="top" hidden><img src="logo-mark.svg" alt=""><div class="t">NOA COSMETICS<small>דף הניהול</small></div><button class="btn ghost sm" id="refresh" aria-label="רענון">↻</button><button class="btn ghost sm" id="pwbtn" aria-label="סיסמה">🔐</button><button class="btn ghost sm" id="logout">יציאה</button></div>
<main id="app"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="admin.js?v=1"></script>
</body>
</html>
